appId: io.backline.rig
productName: Backline
copyright: Apache-2.0
directories:
  output: release
  buildResources: build

# The bundled app is only the Electron shell; the farm itself is a plain copy of
# the checkout (with node_modules), spawned with the Electron binary in
# ELECTRON_RUN_AS_NODE mode. See docs/desktop.md.
files:
  - dist/**
  - package.json
  - "!**/*.map"

# asar is off on purpose: the bundled Postgres binaries are located from the
# package's own __dirname, which inside an archive is a path that cannot be
# spawned (ENOTDIR). asarUnpack does not help because the resolved path still
# points at app.asar.
asar: false

extraResources:
  # The farm, compiled to JavaScript with production-only dependencies, built by
  # `npm run build:farm` (apps/desktop/scripts/build-farm.mjs). It carries no
  # TypeScript sources, no tsx and no TypeScript compiler: the packaged app
  # spawns plain `node`. See docs/desktop.md.
  - from: farm-dist
    to: farm
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!.modules-stamp"

  # node_modules is a separate entry: electron-builder's `files`-style filters
  # skip it inside a directory copy.
  - from: farm-dist/node_modules
    to: farm/node_modules
    filter:
      - "**/*"
      - "!**/.DS_Store"

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
  darkModeSupport: true
  # Unsigned by default. To sign and notarise, set CSC_LINK / CSC_KEY_PASSWORD and
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID, then flip these to
  # `identity: <Developer ID Application: …>` and `notarize: true`.
  identity: null
  notarize: false
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: Backline
